name: PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - development
      - staging
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE@$: true,    # Future-proof Node.js change

jobs:
  branch-flow-check:
    name: branch-flow-check
    runs-on: ubuntu-latest

    steps:
      - name: Validate allowed promotion path
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "PR source branch: $HEAD_REF"
          echo "PR target branch: $BASE_REF"

          allowed=false

          # Any feature/fix/chore/etc branch -> development
          if [[ "$BASE_REF" == "development" ]]; then
            allowed=true
          fi

          # Only development -> staging
          if [[ "$BASE_REF" == "staging" && "$HEAD_REF" == "development" ]]; then
            allowed=true
          fi

          # Only staging -> main
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" == "staging" ]]; then
            allowed=true
          fi

          if [[ "$allowed" != "true" ]]; then
            echo "Invalid PR flow: $HEAD_REF -> $BASE_REF"
            echo "Allowed flows are:"
            echo "  * any working branch -> development"
            echo "  * development -> staging"
            echo "  * staging -> main"
            exit 1
          fi

          echo "Branch flow is valid."

  ci-checks:
    name: ci-checks
    runs-on: ubuntu-latest
    needs: branch-flow-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black  # Install the linters
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Lint with Flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. Remove "--exit-zero" to block the PR on style issues.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics