# ========================
# Network
# ========================
bind 0.0.0.0
port ${REDIS_PORT}
protected-mode no

# ========================
# Persistence
# ========================
appendonly yes
appendfilename "appendonly.aof"

# ========================
# Memory Management
# ========================
maxmemory 512mb
maxmemory-policy allkeys-lru

# ========================
# Logging
# ========================
loglevel notice

# ========================
# Performance
# ========================
tcp-keepalive 60

# ========================
# (Optional) Security
# ========================
requirepass ${REDIS_PASSWORD}