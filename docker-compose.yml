version: "3.9"

services:
  backend:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - ./env/backend/.env
    volumes:
      - ./backend:/app/backend

  redis:
    image: redis/redis-stack:latest
    container_name: redis_stack
    env_file:
      - ./env/backend/.env
    ports:
      - "${REDIS_PORT}:6379"
      - "${REDIS_INSIGHT_PORT}:8001"
    volumes:
      - ./redis/redis.conf:/tmp/redis.conf
      - redis_data:/data
    command: >
      sh -c "
      envsubst < /tmp/redis.conf > /etc/redis-stack.conf &&
      redis-stack-server /etc/redis-stack.conf
      "

volumes:
  redis_data: