version: "3.9"

services:
  backend:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - ./env/backend/.env
    volumes:
      - ./backend:/app/backend

  redis:
    image: redis/redis-stack:latest
    container_name: redis_stack
    env_file:
      - ./env/backend/.env
    ports:
      - "${REDIS_PORT}:6379"
      - "${REDIS_INSIGHT_PORT}:8001"
    volumes:
      - redis_data:/data
    command: >
      sh -c "
      redis-stack-server
      --requirepass $$REDIS_PASSWORD
      --port 6379
      "

volumes:
  redis_data: